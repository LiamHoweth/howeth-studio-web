<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -30 232 330" width="232" height="330">
  <!--
    Bramble, the beopity wandering house (original mascot): a weathered stone
    cottage with slate roofs, moss and ivy, a soot-black chimney and lamp-lit
    window eyes. Plain-SVG port of components/studio/art/Bramble.tsx in a still,
    mid-stride walk pose: shutters open (omitted), coal smoke frozen as a trail.
    The artwork keeps the component's 0 0 220 300 coordinates; the viewBox is
    widened so the smoke and pennant above y = 0 are not clipped.
    Source for scripts/generate-bramble-brand.mjs.
  -->
  <title>Bramble, the beopity wandering house</title>
  <defs>
    <pattern id="bramble-stripes" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#2f2b29"/>
      <rect width="10" height="5" fill="#7d3a28"/>
    </pattern>
    <linearGradient id="bramble-stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a645c"/>
      <stop offset=".55" stop-color="#4f4a44"/>
      <stop offset="1" stop-color="#36322e"/>
    </linearGradient>
    <linearGradient id="bramble-tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e675e"/>
      <stop offset=".65" stop-color="#524c45"/>
      <stop offset="1" stop-color="#3a3531"/>
    </linearGradient>
    <linearGradient id="bramble-slate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#47586a"/>
      <stop offset="1" stop-color="#2b3540"/>
    </linearGradient>
    <linearGradient id="bramble-timber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4636"/>
      <stop offset="1" stop-color="#3b2d23"/>
    </linearGradient>
    <radialGradient id="bramble-lamp" cx=".42" cy=".4" r=".7">
      <stop offset="0" stop-color="#fff1c4"/>
      <stop offset=".45" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#c4611f"/>
    </radialGradient>
    <radialGradient id="bramble-halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffb347" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <filter id="bramble-hand" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="2.4"/>
    </filter>
  </defs>

  <ellipse cx="110" cy="294" rx="64" ry="6.5" fill="#120e0c" opacity=".3"/>

  <!-- Charcoal-and-rust striped legs in worn boots, mid-stride. -->
  <g>
    <g transform="rotate(7 86 206)">
      <path d="M79 204 L93 204 L92 250 L80 250 Z" fill="url(#bramble-stripes)" stroke="#1b1715" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M82 226 h7 v7 h-7 Z" fill="#6b5a45" stroke="#1b1715" stroke-width="1.4"/>
      <g transform="rotate(-3.5 86 249)">
        <path d="M80 248 L92 248 L91 278 L81 278 Z" fill="url(#bramble-stripes)" stroke="#1b1715" stroke-width="2.6" stroke-linejoin="round"/>
        <circle cx="86" cy="249" r="6.5" fill="#3a3330" stroke="#1b1715" stroke-width="2.4"/>
        <path d="M77 276 Q76 292 82 293 L103 293 Q108 292 105 285 Q100 280 93 279 L93 274 L78 274 Z" fill="#2e211a" stroke="#1b1715" stroke-width="2.6" stroke-linejoin="round"/>
        <path d="M76 272 h19 v5 h-19 Z" fill="#4a3528" stroke="#1b1715" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M78 288 L106 288" stroke="#120e0c" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M83 282 l4 -2" stroke="#5b4535" stroke-width="1.4" stroke-linecap="round"/>
      </g>
    </g>
    <g transform="rotate(-7 134 206)">
      <path d="M127 204 L141 204 L140 250 L128 250 Z" fill="url(#bramble-stripes)" stroke="#1b1715" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M130 226 h7 v7 h-7 Z" fill="#6b5a45" stroke="#1b1715" stroke-width="1.4"/>
      <g transform="rotate(3.5 134 249)">
        <path d="M128 248 L140 248 L139 278 L129 278 Z" fill="url(#bramble-stripes)" stroke="#1b1715" stroke-width="2.6" stroke-linejoin="round"/>
        <circle cx="134" cy="249" r="6.5" fill="#3a3330" stroke="#1b1715" stroke-width="2.4"/>
        <path d="M125 276 Q124 292 130 293 L151 293 Q156 292 153 285 Q148 280 141 279 L141 274 L126 274 Z" fill="#2e211a" stroke="#1b1715" stroke-width="2.6" stroke-linejoin="round"/>
        <path d="M124 272 h19 v5 h-19 Z" fill="#4a3528" stroke="#1b1715" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M126 288 L154 288" stroke="#120e0c" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M131 282 l4 -2" stroke="#5b4535" stroke-width="1.4" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <g filter="url(#bramble-hand)">
    <!-- Heavy coal smoke, frozen as a fading trail. -->
    <g fill="#8d8781" stroke="#5c5752" stroke-width="1.5">
      <circle cx="106" cy="20" r="8" opacity=".95"/>
      <circle cx="112" cy="7" r="10" fill="#77716b" opacity=".8"/>
      <circle cx="103" cy="-8" r="12" fill="#a39d96" opacity=".55"/>
    </g>

    <!-- Squat stone tower, slate cone, a tattered pennant on an iron spike. -->
    <path d="M130 46 L168 46 L171 128 L127 128 Z" fill="url(#bramble-tower)" stroke="#1b1715" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M130 60 h16 M150 60 h18 M132 74 h10 M146 74 h22 M130 90 h20 M154 90 h15 M131 106 h12 M147 106 h22 M129 120 h18" stroke="#25211e" stroke-width="1.8" stroke-linecap="round" opacity=".85"/>
    <path d="M146 60 v14 M142 74 v16 M150 90 v16 M143 106 v14" stroke="#25211e" stroke-width="1.6" opacity=".7"/>
    <path d="M160 98 l4 6 -3 5 4 7" stroke="#1d1a17" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <path d="M124 50 L149 4 L174 50 Q149 57 124 50 Z" fill="url(#bramble-slate)" stroke="#1b1715" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M131 40 Q149 46 167 40 M137 28 Q149 32 161 28 M142 17 Q149 20 156 17" stroke="#1f2830" stroke-width="1.8" fill="none"/>
    <path d="M128 48 Q136 44 142 50" fill="#5f7d3c" stroke="#1b1715" stroke-width="1.4"/>
    <path d="M149 4 L149 -12" stroke="#2a2522" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M149 -12 L168 -8 L161 -5 L167 -1 L149 -2 Z" fill="#7d2b22" stroke="#1b1715" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="148.5" cy="79" r="16" fill="url(#bramble-halo)"/>
    <path d="M142 88 V76 Q148.5 66 155 76 V88 Z" fill="url(#bramble-lamp)" stroke="#1b1715" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M148.5 70 V88" stroke="#1b1715" stroke-width="1.6"/>

    <!-- Soot-black brick chimney with an iron cap. -->
    <path d="M98 30 L114 30 L115 70 L97 70 Z" fill="#3d2b26" stroke="#1b1715" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M98 40 h16 M98 50 h17 M97 60 h18 M104 30 v10 M108 40 v10 M103 50 v10" stroke="#24180f" stroke-width="1.4" opacity=".8"/>
    <path d="M94 25 h24 v7 h-24 Z" fill="#2a2522" stroke="#1b1715" stroke-width="2.4" stroke-linejoin="round"/>

    <!-- Plank attic, slate roof gone green with moss, leaning a touch left. -->
    <g transform="rotate(-4 84 80)">
      <path d="M58 64 L108 64 L108 104 L58 104 Z" fill="url(#bramble-timber)" stroke="#1b1715" stroke-width="2.8" stroke-linejoin="round"/>
      <path d="M58 74 h50 M58 84 h50 M58 94 h50" stroke="#2a1f17" stroke-width="1.6" opacity=".8"/>
      <path d="M96 86 h10 v9 h-10 Z" fill="#6b5a45" stroke="#1b1715" stroke-width="1.4"/>
      <path d="M50 68 L83 26 L116 68 Z" fill="url(#bramble-slate)" stroke="#1b1715" stroke-width="2.8" stroke-linejoin="round"/>
      <path d="M62 60 L83 34 M74 62 L90 42 M88 64 L101 49" stroke="#1f2830" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M52 68 Q60 58 70 64 Q76 56 84 64 L86 68 Z" fill="#5f7d3c" stroke="#1b1715" stroke-width="1.6" stroke-linejoin="round"/>
      <circle cx="83" cy="84" r="13" fill="url(#bramble-halo)"/>
      <circle cx="83" cy="84" r="8.5" fill="url(#bramble-lamp)" stroke="#1b1715" stroke-width="2.2"/>
      <path d="M83 75.5 v17 M74.5 84 h17" stroke="#1b1715" stroke-width="1.8"/>
    </g>

    <!-- A frayed rope of laundry from chimney to tower. -->
    <path d="M114 44 Q122 53 130 48" stroke="#4a3f36" stroke-width="1.4" fill="none"/>
    <path d="M117 47 l3 9 l4 -1 l-1 -8 Z" fill="#4b5d6e" stroke="#1b1715" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M124 49 l1 7 l5 0 l0 -7 Z" fill="#8a6a3a" stroke="#1b1715" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Main slate roof, chipped and mossy, with a gnarled rooftop tree. -->
    <path d="M34 128 L56 98 L184 98 L192 128 Z" fill="url(#bramble-slate)" stroke="#1b1715" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M46 117 h138 M56 107 h124 M70 98 v9 M96 98 v9 M124 98 v9 M152 98 v9 M60 107 v10 M84 107 v10 M112 107 v10 M140 107 v10 M168 107 v10" stroke="#1f2830" stroke-width="1.6" stroke-linecap="round" opacity=".9"/>
    <path d="M150 117 l8 0 -2 6 -7 0 Z" fill="#20262d"/>
    <path d="M38 124 Q46 106 60 112 Q66 100 78 110 Q86 104 92 114 L94 124 Z" fill="#5f7d3c" stroke="#1b1715" stroke-width="2" stroke-linejoin="round"/>
    <path d="M44 120 Q52 112 62 117 M70 116 Q78 110 86 118" stroke="#3f5a2a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M176 100 Q173 90 178 84 Q174 80 176 74" stroke="#2e2219" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <path d="M177 84 l7 -5" stroke="#2e2219" stroke-width="2" stroke-linecap="round"/>
    <circle cx="175" cy="70" r="11" fill="#3f5a2a" stroke="#1b1715" stroke-width="2.2"/>
    <circle cx="185" cy="77" r="6" fill="#3f5a2a" stroke="#1b1715" stroke-width="2"/>
    <circle cx="171" cy="66" r="4" fill="#5f7d3c"/>

    <!-- Main cottage: rough-cut stone, sooty timber and creeping ivy. -->
    <path d="M44 128 L182 128 L180 204 L46 204 Z" fill="url(#bramble-stone)" stroke="#1b1715" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M46 150 h18 M46 172 h18 M46 192 h18 M160 150 h20 M160 172 h20 M160 192 h20 M66 196 h28 M126 196 h32" stroke="#25211e" stroke-width="1.8" stroke-linecap="round" opacity=".8"/>
    <path d="M55 128 v22 M58 150 v22 M54 172 v20 M170 128 v22 M168 150 v22 M172 172 v20" stroke="#25211e" stroke-width="1.6" opacity=".6"/>
    <path d="M46 140 L180 140 M66 128 L67 204 M158 128 L157 204" stroke="#2b2019" stroke-width="4" stroke-linecap="round"/>
    <path d="M74 132 l3 5 -2 4" stroke="#1d1a17" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    <path d="M178 130 Q172 148 178 162 Q184 176 176 196" stroke="#3f5a2a" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <g fill="#5f7d3c" stroke="#1b1715" stroke-width="1.2">
      <ellipse cx="175" cy="140" rx="4" ry="2.6" transform="rotate(-30 175 140)"/>
      <ellipse cx="180" cy="154" rx="4" ry="2.6" transform="rotate(25 180 154)"/>
      <ellipse cx="174" cy="168" rx="4" ry="2.6" transform="rotate(-20 174 168)"/>
      <ellipse cx="181" cy="184" rx="4" ry="2.6" transform="rotate(30 181 184)"/>
    </g>

    <!-- Lamp-lit window eyes (shutters open, so omitted) under heavy stone brows. -->
    <circle cx="92" cy="162" r="22" fill="url(#bramble-halo)"/>
    <circle cx="134" cy="162" r="22" fill="url(#bramble-halo)"/>
    <circle cx="92" cy="162" r="14" fill="url(#bramble-lamp)" stroke="#1b1715" stroke-width="2.8"/>
    <circle cx="134" cy="162" r="14" fill="url(#bramble-lamp)" stroke="#1b1715" stroke-width="2.8"/>
    <circle cx="95" cy="164" r="5.4" fill="#2b1a10"/>
    <circle cx="137" cy="164" r="5.4" fill="#2b1a10"/>
    <circle cx="97" cy="161" r="1.8" fill="#fff1c4"/>
    <circle cx="139" cy="161" r="1.8" fill="#fff1c4"/>
    <path d="M76 146 Q92 140 108 147 M118 147 Q134 140 150 146" stroke="#2b2019" stroke-width="4.5" fill="none" stroke-linecap="round"/>

    <!-- Window boxes. -->
    <path d="M76 180 h32 M118 180 h32" stroke="#2e2219" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="82" cy="177.5" r="2.6" fill="#8e2a22"/><circle cx="92" cy="177" r="2.6" fill="#b86a2a"/><circle cx="102" cy="177.5" r="2.6" fill="#8e2a22"/>
    <circle cx="124" cy="177.5" r="2.6" fill="#b86a2a"/><circle cx="134" cy="177" r="2.6" fill="#8e2a22"/><circle cx="144" cy="177.5" r="2.6" fill="#b86a2a"/>

    <!-- Iron-banded oak door; lamplight leaks round its edge. -->
    <path d="M103 204 L103 190 Q113 179 123 190 L123 204 Z" fill="#ffb347" opacity=".55"/>
    <path d="M104.5 204 L104.5 191 Q113 181.5 121.5 191 L121.5 204 Z" fill="#2e211a" stroke="#1b1715" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M105 194 h16 M105 200 h16" stroke="#4b4642" stroke-width="1.8"/>
    <circle cx="118" cy="197" r="1.6" fill="#ffb347"/>

    <!-- Heavy timber undercarriage, iron straps and a lit lantern. -->
    <path d="M40 202 L186 202 Q184 215 172 215 L54 215 Q42 215 40 202 Z" fill="#3b2d23" stroke="#1b1715" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M62 203 v11 M110 203 v12 M160 203 v11" stroke="#4b4642" stroke-width="3"/>
    <g fill="#7d7670"><circle cx="62" cy="206" r="1.3"/><circle cx="110" cy="206" r="1.3"/><circle cx="160" cy="206" r="1.3"/><circle cx="62" cy="211" r="1.3"/><circle cx="110" cy="211" r="1.3"/><circle cx="160" cy="211" r="1.3"/></g>
    <path d="M168 215 v8" stroke="#1b1715" stroke-width="1.6"/>
    <circle cx="168" cy="228" r="11" fill="url(#bramble-halo)"/>
    <rect x="163" y="222" width="10" height="12" rx="3" fill="url(#bramble-lamp)" stroke="#1b1715" stroke-width="2"/>
  </g>
</svg>
