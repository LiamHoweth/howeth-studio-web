name: Validate studio site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:hosting
      - run: npm run test:beopity
      - run: npm run test:ambient
      - run: npm run build
      # The build command requires exact mitigation bytes/behavior and records the full,
      # unmodified npm audit report and its original exit status.
      - name: Verify runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Preserve raw dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-evidence
          path: .build/security/npm-audit-*
          if-no-files-found: error
          include-hidden-files: true
